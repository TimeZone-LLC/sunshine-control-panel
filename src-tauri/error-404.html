<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunshine unavailable</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-page: #0a0a0b;
        --bg-panel: #111113;
        --bg-raised: #1d1d21;
        --border: #303036;
        --border-strong: #3f3f47;
        --text: #ededf0;
        --text-muted: #9a9aa4;
        --text-faint: #6e6e78;
        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
        border-radius: 0;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 20px;
        background: var(--bg-page);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: 13px;
      }

      main {
        width: min(480px, 100%);
        border: 1px solid var(--border);
        background: var(--bg-panel);
      }

      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .content {
        padding: 16px;
      }

      p {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.45;
      }

      .checks {
        margin: 16px 0;
        padding: 0;
        border-top: 1px solid var(--border);
        list-style: none;
      }

      .checks li {
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        color: var(--text-muted);
      }

      button {
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        background: var(--bg-raised);
        color: var(--text);
        font: 500 13px var(--font-sans);
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
      }

      button:hover {
        background: var(--bg-panel);
        border-color: var(--text-faint);
      }

      button:focus-visible {
        outline: 1px solid var(--text);
        outline-offset: 2px;
      }

      #connection-status {
        min-height: 18px;
        margin-top: 12px;
        color: var(--text-faint);
        font-family: var(--font-mono);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Sunshine is unavailable</h1>
      </header>
      <div class="content">
        <p>The control panel cannot reach the Sunshine service.</p>
        <ul class="checks">
          <li>Confirm that the Sunshine service is running.</li>
          <li>Confirm that port 47990 is available.</li>
          <li>Check local firewall rules if the service is running.</li>
        </ul>
        <button id="retry-button" type="button">Retry now</button>
        <div id="connection-status" role="status" aria-live="polite">Checking connection...</div>
      </div>
    </main>

    <script>
      const PHASE1_DURATION = 10
      const PHASE2_INTERVAL = 5
      const PHASE2_ROUNDS = 4
      const PHASE3_INTERVAL = 30
      const statusElement = document.getElementById('connection-status')
      const retryButton = document.getElementById('retry-button')
      let roundCount = 0
      let countdown = 0
      let countdownTimer = null
      let probeGeneration = 0

      async function probe(timeoutMs = 5000) {
        try {
          const response = await fetch(`${location.origin}/`, {
            method: 'GET',
            cache: 'no-store',
            signal: AbortSignal.timeout(timeoutMs),
          })
          return response.status !== 502 && response.status !== 503
        } catch {
          return false
        }
      }

      function clearCountdown() {
        if (countdownTimer !== null) {
          clearInterval(countdownTimer)
          countdownTimer = null
        }
      }

      function onSuccess(generation) {
        if (generation !== probeGeneration) return
        clearCountdown()
        statusElement.textContent = 'Sunshine is available. Reloading...'
        setTimeout(() => location.reload(), 300)
      }

      function scheduleNextRound(generation) {
        if (generation !== probeGeneration) return
        roundCount += 1
        const interval = roundCount <= 1 + PHASE2_ROUNDS ? PHASE2_INTERVAL : PHASE3_INTERVAL
        countdown = interval

        const updateStatus = () => {
          statusElement.textContent = `Connection check ${roundCount - 1} failed. Retrying in ${countdown} seconds.`
        }

        updateStatus()
        clearCountdown()
        countdownTimer = setInterval(() => {
          countdown -= 1
          if (countdown <= 0) {
            clearCountdown()
            normalProbe(generation)
          } else {
            updateStatus()
          }
        }, 1000)
      }

      async function phase1(generation) {
        roundCount = 1
        for (let attempt = 0; attempt < PHASE1_DURATION; attempt += 1) {
          if (generation !== probeGeneration) return
          statusElement.textContent = 'Checking connection...'
          if (await probe(1000)) return onSuccess(generation)
          if (attempt < PHASE1_DURATION - 1) {
            await new Promise((resolve) => setTimeout(resolve, 1000))
          }
        }
        scheduleNextRound(generation)
      }

      async function normalProbe(generation) {
        if (generation !== probeGeneration) return
        statusElement.textContent = `Checking connection (${roundCount})...`
        if (await probe()) return onSuccess(generation)
        scheduleNextRound(generation)
      }

      function startProbeCycle() {
        clearCountdown()
        probeGeneration += 1
        phase1(probeGeneration)
      }

      retryButton.addEventListener('click', startProbeCycle)
      startProbeCycle()
    </script>
  </body>
</html>
