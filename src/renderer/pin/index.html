<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="../../assets/sunshine.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIN pairing</title>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../../assets/fonts/Geist-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Geist';
        src: url('../../assets/fonts/Geist-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Geist Mono';
        src: url('../../assets/fonts/GeistMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /* Brutalist tokens, inlined because this page is a standalone HTML entry
         and does not go through the shared LESS layer. */
      :root {
        --bg: #0a0a0b;
        --bg-panel: #111113;
        --bg-input: #141416;
        --bg-hover: #1d1d21;
        --border: #303036;
        --border-strong: #3f3f47;
        --text: #ededf0;
        --text-dim: #9a9aa4;
        /* The only hue on this page, and only when pairing actually fails. */
        --error: #e05a52;
        /* "Paired" is brighter text, never green. */
        --on: #ededf0;
        --scrim: rgba(0, 0, 0, 0.66);
        --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      :root[data-theme='light'] {
        --bg: #f7f7f8;
        --bg-panel: #ffffff;
        --bg-input: #ffffff;
        --bg-hover: #eeeeef;
        --border: #cfcfd3;
        --border-strong: #a8a8b0;
        --text: #15151a;
        --text-dim: #5c5c66;
        --error: #b3352c;
        --on: #15151a;
        --scrim: rgba(0, 0, 0, 0.35);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        border-radius: 0;
        box-shadow: none;
        text-shadow: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: var(--font-sans);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--scrim);
        cursor: pointer;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .pin-container {
        padding: 16px;
        max-width: 420px;
        width: 90%;
        background: var(--bg-panel);
        border: 1px solid var(--border-strong);
        cursor: default;
      }

      h1 {
        color: var(--text);
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 500;
        text-align: left;
        text-transform: none;
        letter-spacing: normal;
      }

      .subtitle {
        color: var(--text-dim);
        margin-bottom: 16px;
        font-size: 13px;
        text-align: left;
      }

      .pin-inputs {
        display: flex;
        justify-content: flex-start;
        gap: 6px;
        margin-bottom: 0;
      }

      .pin-input {
        width: 40px;
        height: 44px;
        text-align: center;
        font-size: 20px;
        font-weight: 400;
        font-family: var(--font-mono);
        border: 1px solid var(--border);
        outline: none;
        transition: background-color 80ms linear, color 80ms linear, border-color 80ms linear;
        background: var(--bg-input);
        color: var(--text);
        caret-color: var(--text);
      }

      .pin-input:focus {
        border-color: var(--border-strong);
        outline: 1px solid var(--border-strong);
        outline-offset: 0;
      }

      .pin-input:not(:placeholder-shown) {
        border-color: var(--border-strong);
      }

      .pin-input:disabled {
        background: var(--bg-panel);
        color: var(--text-dim);
        cursor: not-allowed;
      }

      .status {
        margin-top: 10px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        font-size: 13px;
        text-align: left;
        display: none;
        font-weight: 400;
      }

      .status.success {
        background: var(--bg);
        color: var(--on);
        border-color: var(--border-strong);
        display: block;
      }

      .status.error {
        background: var(--bg);
        color: var(--error);
        border-color: var(--error);
        display: block;
      }

      .status.loading {
        background: var(--bg);
        color: var(--text-dim);
        display: block;
      }

      /* The one motion the design system keeps: a plain linear loading spinner. */
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--text);
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
        border-radius: 50%;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      ::selection {
        background: var(--text);
        color: var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="pin-container">
      <h1 id="page-title">PIN pairing</h1>
      <p class="subtitle" id="subtitle">Enter the 4-digit PIN shown in Moonlight to pair this client.</p>

      <div class="pin-inputs">
        <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="\d" data-index="0" autofocus />
        <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="\d" data-index="1" />
        <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="\d" data-index="2" />
        <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="\d" data-index="3" />
      </div>

      <div id="status" class="status"></div>
    </div>

    <script type="module">
      import { pickSimpleMessages, setDocumentLocale } from '../shared/simple-i18n.js'

      const MESSAGES = {
        en: {
          title: 'PIN pairing',
          heading: 'PIN pairing',
          subtitle: 'Enter the 4-digit PIN shown in Moonlight to pair this client.',
          defaultClientName: 'Moonlight Client',
          startingService: 'Starting service...',
          startingServiceProgress: 'Starting service... ({progress}%)',
          cannotConnect: 'Cannot connect to the service. Make sure Sunshine is running.',
          serviceNotReady: 'Service is not ready yet. Please wait...',
          pairing: 'Pairing...',
          pairSuccess: 'Pairing successful!',
          pairIncorrect: 'Pairing failed: incorrect PIN',
          requestFailed: 'Request failed',
          requestTimeout: 'Request timed out. Check your network connection or try again later.',
          requestTimeoutShort: 'Request timed out. Check your network connection.',
          networkError: 'Network error',
        },
      }

      let text = pickSimpleMessages(MESSAGES)

      const applyText = () => {
        text = pickSimpleMessages(MESSAGES)
        setDocumentLocale()
        document.title = text.title
        document.getElementById('page-title').textContent = text.heading
        document.getElementById('subtitle').textContent = text.subtitle
        if (
          state.clientName === CONFIG.DEFAULT_CLIENT_NAME ||
          state.clientName === MESSAGES.en.defaultClientName
        ) {
          state.clientName = text.defaultClientName
        }
      }

      const CONFIG = {
        DEFAULT_PROXY_URL: 'http://localhost:48081',
        DEFAULT_CLIENT_NAME: 'Moonlight Client',
        PIN_LENGTH: 4,
        CLOSE_DELAY: 2000,
        PROXY_CHECK_INTERVAL: 1000, // One second between polls.
        PROXY_CHECK_MAX_RETRIES: 30, // 30 polls, so 30 seconds.
        PROXY_CHECK_TIMEOUT: 3000, // Three second timeout per request.
      }

      const state = {
        isSubmitting: false,
        proxyUrl: CONFIG.DEFAULT_PROXY_URL,
        clientName: CONFIG.DEFAULT_CLIENT_NAME,
        proxyReady: false,
      }

      const $ = (selector) => document.querySelector(selector)
      const $$ = (selector) => document.querySelectorAll(selector)

      const statusEl = $('#status')
      const pinInputs = $$('.pin-input')

      const showStatus = (message, type) => {
        statusEl.innerHTML = message
        statusEl.className = `status ${type}`
      }

      const setInputsDisabled = (disabled) => {
        pinInputs.forEach((input) => (input.disabled = disabled))
      }

      const closeWindow = async () => {
        try {
          const { getCurrentWindow } = await import('@tauri-apps/api/window')
          await getCurrentWindow().close()
        } catch {}
      }

      const getPin = () => Array.from(pinInputs, (i) => i.value).join('')

      const clearPin = () => {
        pinInputs.forEach((i) => (i.value = ''))
        pinInputs[0].focus()
      }

      const getProxyUrl = async () => {
        try {
          const { invoke } = await import('@tauri-apps/api/core')
          state.proxyUrl = await invoke('get_proxy_url_command')
          console.log('Proxy URL:', state.proxyUrl)
        } catch (e) {
          console.warn('Failed to read the proxy URL; using the default:', e)
        }
      }

      const waitForProxy = async () => {
        showStatus(`<span class="spinner"></span>${text.startingService}`, 'loading')
        setInputsDisabled(true)

        for (let i = 0; i < CONFIG.PROXY_CHECK_MAX_RETRIES; i++) {
          try {
            // AbortController gives us a hard timeout per request.
            const controller = new AbortController()
            const timeoutId = setTimeout(() => controller.abort(), CONFIG.PROXY_CHECK_TIMEOUT)

            const response = await fetch(`${state.proxyUrl}/api/config`, {
              method: 'GET',
              signal: controller.signal,
            })

            clearTimeout(timeoutId)

            if (response.ok) {
              console.log('Proxy service ready')
              state.proxyReady = true
              statusEl.className = 'status'
              statusEl.innerHTML = ''
              setInputsDisabled(false)
              pinInputs[0].focus()
              return true
            } else {
              console.log(
                `Unexpected proxy response (${response.status}); still waiting (${i + 1}/${CONFIG.PROXY_CHECK_MAX_RETRIES})`
              )
            }
          } catch (e) {
            if (e.name === 'AbortError') {
              console.log(`Request timed out; still waiting for the proxy (${i + 1}/${CONFIG.PROXY_CHECK_MAX_RETRIES})`)
            } else {
              console.log(`Waiting for the proxy service to start (${i + 1}/${CONFIG.PROXY_CHECK_MAX_RETRIES})`, e.message)
            }

            // Refresh the status line.
            const progress = Math.floor(((i + 1) / CONFIG.PROXY_CHECK_MAX_RETRIES) * 100)
            showStatus(
              `<span class="spinner"></span>${text.startingServiceProgress.replace('{progress}', progress)}`,
              'loading'
            )
          }

          await new Promise((resolve) => setTimeout(resolve, CONFIG.PROXY_CHECK_INTERVAL))
        }

        showStatus(`${text.cannotConnect}`, 'error')
        setInputsDisabled(false)
        return false
      }

      const getClientName = async () => {
        try {
          const response = await fetch(`${state.proxyUrl}/api/config`)
          if (!response.ok) return

          const data = await response.json()
          const name = data.pair_name || data.sunshine_name
          if (name) {
            state.clientName = name
            console.log('Client name:', name)
          }
        } catch (e) {
          console.warn('Failed to read the client name; using the default:', e)
        }
      }

      const submitPin = async (pin) => {
        const controller = new AbortController()
        const timeoutId = setTimeout(() => controller.abort(), 10000) // Ten second timeout.

        try {
          const response = await fetch(`${state.proxyUrl}/api/pin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin, name: state.clientName }),
            signal: controller.signal,
          })

          clearTimeout(timeoutId)

          if (!response.ok) {
            const errorText = await response.text().catch(() => '')
            throw new Error(`HTTP ${response.status}: ${errorText || text.requestFailed}`)
          }

          return await response.json()
        } catch (e) {
          clearTimeout(timeoutId)
          if (e.name === 'AbortError') {
            throw new Error(text.requestTimeoutShort)
          }
          throw e
        }
      }

      const handleAutoSubmit = async () => {
        const pin = getPin()
        if (pin.length !== CONFIG.PIN_LENGTH || state.isSubmitting || !/^\d+$/.test(pin)) return
        if (!state.proxyReady) {
          showStatus(`${text.serviceNotReady}`, 'loading')
          return
        }

        state.isSubmitting = true
        setInputsDisabled(true)
        showStatus(`<span class="spinner"></span>${text.pairing}`, 'loading')

        try {
          const data = await submitPin(pin)
          const isSuccess = String(data.status).toLowerCase() === 'true'

          if (isSuccess) {
            showStatus(`${text.pairSuccess}`, 'success')
            setTimeout(closeWindow, CONFIG.CLOSE_DELAY)
          } else {
            showStatus(`${text.pairIncorrect}`, 'error')
            clearPin()
            setInputsDisabled(false)
          }
        } catch (error) {
          console.error('Pairing failed:', error)
          const errorMsg = error.message || text.networkError
          if (errorMsg.includes('timeout')) {
            showStatus(`${text.requestTimeout}`, 'error')
          } else if (errorMsg.includes('Failed to fetch') || errorMsg.includes('NetworkError')) {
            showStatus(`${text.cannotConnect}`, 'error')
          } else {
            showStatus(`${errorMsg}`, 'error')
          }
          clearPin()
          setInputsDisabled(false)
        } finally {
          state.isSubmitting = false
        }
      }

      const handleInput = (input, index) => {
        input.value = input.value.replace(/\D/g, '')
        if (input.value && index < CONFIG.PIN_LENGTH - 1) {
          pinInputs[index + 1].focus()
        }
        if (getPin().length === CONFIG.PIN_LENGTH) {
          handleAutoSubmit()
        }
      }

      const handleKeydown = (e, index) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          pinInputs[index - 1].focus()
        }
      }

      const handlePaste = (e) => {
        e.preventDefault()
        const data = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, CONFIG.PIN_LENGTH)
        data.split('').forEach((char, i) => {
          if (pinInputs[i]) pinInputs[i].value = char
        })
        pinInputs[Math.min(data.length, CONFIG.PIN_LENGTH - 1)].focus()
        if (getPin().length === CONFIG.PIN_LENGTH) {
          handleAutoSubmit()
        }
      }

      const setupEventListeners = () => {
        pinInputs.forEach((input, index) => {
          input.addEventListener('input', () => handleInput(input, index))
          input.addEventListener('keydown', (e) => handleKeydown(e, index))
          input.addEventListener('paste', handlePaste)
        })

        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && !state.isSubmitting) {
            closeWindow()
          }
        })

        document.body.addEventListener('click', (e) => {
          if (e.target === document.body && !state.isSubmitting) {
            closeWindow()
          }
        })
      }

      const init = async () => {
        applyText()
        await getProxyUrl()
        setupEventListeners()

        // Wait for the proxy service to become ready.
        const proxyReady = await waitForProxy()
        if (proxyReady) {
          await getClientName()
        }
      }

      init()
    </script>
  </body>
</html>
