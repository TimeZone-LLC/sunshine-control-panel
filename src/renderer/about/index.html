<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../../assets/sunshine.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Sunshine Control Panel</title>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../../assets/fonts/Geist-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Geist';
        src: url('../../assets/fonts/Geist-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Geist Mono';
        src: url('../../assets/fonts/GeistMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /* This standalone entry does not pass through the shared LESS layer. */
      :root {
        color-scheme: dark;
        --bg: #0a0a0b;
        --bg-panel: #111113;
        --border: #303036;
        --text: #ededf0;
        --text-dim: #9a9aa4;
        --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      :root[data-theme='light'],
      :root[data-bs-theme='light'] {
        color-scheme: light;
        --bg: #f7f7f8;
        --bg-panel: #ffffff;
        --border: #cfcfd3;
        --text: #15151a;
        --text-dim: #5c5c66;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        border-radius: 0;
        box-shadow: none;
      }

      html,
      body {
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: none;
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        align-items: safe center;
        justify-content: center;
        color: var(--text);
      }

      ::-webkit-scrollbar {
        display: none;
      }

      .about-container {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        padding: 16px;
        max-width: 500px;
        width: 90%;
        text-align: left;
      }

      h1 {
        color: var(--text);
        margin-bottom: 6px;
        font-size: 15px;
        font-weight: 500;
        text-transform: none;
        letter-spacing: normal;
      }

      .version {
        color: var(--text-dim);
        margin-bottom: 16px;
        font-size: 13px;
        font-family: var(--font-mono);
      }

      .description {
        color: var(--text-dim);
        line-height: 1.4;
        margin-bottom: 16px;
        font-size: 13px;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 16px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }

      .info-grid.multi-row {
        grid-template-columns: repeat(3, 1fr);
      }

      .info-item {
        text-align: left;
      }

      .info-label {
        color: var(--text-dim);
        font-size: 11px;
        text-transform: none;
        letter-spacing: normal;
        font-weight: 400;
        margin-bottom: 2px;
      }

      .info-value {
        color: var(--text);
        font-size: 13px;
        font-family: var(--font-mono);
      }

    </style>
  </head>
  <body>
    <div class="about-container">
      <h1 data-i18n="appTitle">Sunshine Control Panel</h1>
      <div class="version" id="app-version">Version loading...</div>
      <div class="description" data-i18n="description">
        Version and system information for this installation.
      </div>

      <div class="info-grid" id="info-grid">
        <div class="info-item">
          <div class="info-label">Build time</div>
          <div class="info-value">Loading...</div>
        </div>
        <div class="info-item">
          <div class="info-label">Architecture</div>
          <div class="info-value">Loading...</div>
        </div>
        <div class="info-item">
          <div class="info-label">Tauri version</div>
          <div class="info-value">Loading...</div>
        </div>
      </div>

    </div>

    <script type="module">
      import { pickSimpleMessages, setDocumentLocale } from '../shared/simple-i18n.js'
      import { createAdaptiveSizeObserver } from '../shared/adaptive-window-size.js'

      const MESSAGES = {
        en: {
          title: 'About Sunshine Control Panel',
          appTitle: 'Sunshine Control Panel',
          version: 'Version {version}',
          versionLoading: 'Version loading...',
          description: 'Version and system information for this installation.',
          buildTime: 'Build time',
          architecture: 'Architecture',
          tauriVersion: 'Tauri version',
          operatingSystem: 'Operating system',
          totalMemory: 'Total memory',
          processor: 'Processor',
          loading: 'Loading...',
          unknown: 'Unknown',
        },
      }

      const $ = (id) => document.getElementById(id)
      // Keep a little breathing room around the measured card when resizing the native window.
      const ABOUT_WINDOW_VERTICAL_MARGIN = 48
      let text = pickSimpleMessages(MESSAGES)
      let latestData = null
      let resizeInvoke = null
      let sizeObserver = null

      const notifyShellHeight = () => {
        sizeObserver?.schedule()
      }

      const initWindowSizing = () => {
        sizeObserver = createAdaptiveSizeObserver({
          getElement: () => document.querySelector('.about-container'),
          measureSize: (container) => ({
            height: Math.ceil(container.getBoundingClientRect().height + ABOUT_WINDOW_VERTICAL_MARGIN),
          }),
          applySize: async ({ height }) => {
            try {
              if (!resizeInvoke) {
                const { invoke } = await import('@tauri-apps/api/core')
                resizeInvoke = invoke
              }
              await resizeInvoke('resize_about_window', { height })
            } catch (error) {
              console.warn('Failed to notify shell about height change:', error)
            }
          },
        })
        sizeObserver.start()
      }

      const applyStaticText = () => {
        document.querySelectorAll('[data-i18n]').forEach((element) => {
          const key = element.dataset.i18n
          element.textContent = text[key] || ''
        })
      }

      const applyText = () => {
        text = pickSimpleMessages(MESSAGES)
        setDocumentLocale()
        document.title = text.title
        applyStaticText()
        if (!latestData) {
          $('app-version').textContent = text.versionLoading
          renderInfoGrid(getLoadingRows())
        } else {
          updateUI(latestData)
        }
        notifyShellHeight()
      }

      const createInfoItem = (label, value, fontSize = '13px') => {
        const element = document.createElement('div')
        const labelElement = document.createElement('div')
        const valueElement = document.createElement('div')

        element.className = 'info-item'
        labelElement.className = 'info-label'
        labelElement.textContent = label
        valueElement.className = 'info-value'
        valueElement.style.fontSize = fontSize
        valueElement.textContent = value

        element.append(labelElement, valueElement)
        return element
      }

      const formatMemory = (bytes) => `${(bytes / (1024 ** 3)).toFixed(1)} GB`

      const getLoadingRows = () => [
        { label: text.buildTime, value: text.loading },
        { label: text.architecture, value: text.loading },
        { label: text.tauriVersion, value: text.loading },
      ]

      const getInfoRows = (data) => [
        { label: text.buildTime, value: data.buildTime || text.unknown },
        { label: text.architecture, value: data.arch || text.unknown },
        { label: text.tauriVersion, value: data.tauriVersion || text.unknown },
        data.osVersion && { label: text.operatingSystem, value: data.osVersion },
        data.memoryTotal && { label: text.totalMemory, value: formatMemory(data.memoryTotal) },
        data.cpuModel && { label: text.processor, value: data.cpuModel, fontSize: '12px' },
      ].filter(Boolean)

      const renderInfoGrid = (rows) => {
        const infoGrid = $('info-grid')
        infoGrid.replaceChildren(...rows.map((row) => createInfoItem(row.label, row.value, row.fontSize)))
        infoGrid.classList.toggle('multi-row', rows.length > 3)
        notifyShellHeight()
      }

      const updateUI = (data) => {
        latestData = data
        $('app-version').textContent = text.version.replace('{version}', data.appVersion || text.unknown)
        renderInfoGrid(getInfoRows(data))
      }

      const loadSystemInfo = async () => {
        try {
          const { invoke } = await import('@tauri-apps/api/core')
          const systemInfo = await invoke('get_system_info')

          updateUI({
            appVersion: systemInfo.app_version,
            buildTime: systemInfo.build_time || new Date().toLocaleDateString(),
            arch: systemInfo.arch,
            tauriVersion: systemInfo.tauri_version,
            osVersion: systemInfo.os_version,
            memoryTotal: systemInfo.memory_total,
            cpuModel: systemInfo.cpu_model,
          })
        } catch (error) {
          console.error('Failed to read system information; using defaults:', error)

          updateUI({
            appVersion: '',
            buildTime: new Date().toLocaleDateString(),
            arch: navigator.platform.includes('64') ? 'x64' : 'x86',
            tauriVersion: '',
          })
        }
      }

      const init = () => {
        applyText()
        initWindowSizing()
        loadSystemInfo()
      }

      document.addEventListener('DOMContentLoaded', init)
    </script>
  </body>
</html>
