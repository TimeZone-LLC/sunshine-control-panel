<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunshine Control Panel</title>
    <script>
      ;(() => {
        const savedTheme = localStorage.getItem('sunshine-theme')
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'

        document.documentElement.setAttribute('data-bs-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../assets/fonts/Geist-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --boot-background: #0a0a0b;
        --boot-foreground: #9a9aa4;
        --boot-border: #303036;
        --boot-accent: #ededf0;
      }

      :root[data-bs-theme='light'] {
        --boot-background: #f7f7f8;
        --boot-foreground: #5c5c66;
        --boot-border: #cfcfd3;
        --boot-accent: #15151a;
      }

      body {
        overflow: hidden;
        background: var(--boot-background);
      }

      #app {
        width: 100%;
        height: 100vh;
      }

      .boot-loading {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--boot-foreground);
        font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid var(--boot-border);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot-loading p {
        margin-top: 20px;
        font-size: 13px;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p>Preparing Sunshine...</p>
      </div>
    </div>
    <script type="module" src="./sunshine-frame.js"></script>
  </body>
</html>
